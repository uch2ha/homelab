services:
  glance:
    container_name: glance
    image: glanceapp/glance:${VERSION}
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: wget --spider http://localhost:8080/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config:/app/config
      - ./assets:/app/assets
      - ./widget:/app/widget
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home:/home:ro
    networks:
      - homelab_common

networks:
  homelab_common:
    external: true
