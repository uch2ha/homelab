services:
  ntfy:
    image: binwiederhier/ntfy:${VERSION}
    container_name: ntfy
    restart: unless-stopped
    command:
      - serve
    user: 1000:1000
    env_file:
      - .env
    environment:
      - TZ=Europe/Helsinki
    volumes:
      - ./cache:/var/cache/ntfy
      - ./etc:/etc/ntfy
    healthcheck: # optional: remember to adapt the host:port to your environment
      test:
        [
          'CMD-SHELL',
          "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - homelab_shared
    init: true # needed, if healthcheck is used. Prevents zombie processes
    # ports:
    #   - 80:80

networks:
  homelab_shared:
    external: true
