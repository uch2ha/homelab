services:
  beszel:
    image: henrygd/beszel:${VERSION}
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL}
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket
    networks:
      - homelab_monitoring
    # ports:
    #   - 8090:8090
    # -

  beszel-agent:
    image: henrygd/beszel-agent:${VERSION}
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: ${APP_URL}
      TOKEN: ${TOKEN}
      KEY: ${KEY}
    volumes:
      - ./beszel_agent_data:/var/lib/beszel-agent
      - ./beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home:/extra-filesystems/home__home:ro
      - ${MAIN_1}:/extra-filesystems/hdd__hdd-main:ro
      - ${BACKUP_1}:/extra-filesystems/ssd__ssd-backup:ro

networks:
  homelab_monitoring:
    external: true
