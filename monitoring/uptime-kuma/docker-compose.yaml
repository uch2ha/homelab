services:
  uptime-kuma:
    container_name: uptime-kuma
    image: louislam/uptime-kuma:${VERSION}
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/app/data
    ports:
      - '3001:3001'
    networks:
      - homelab_shared

networks:
  homelab_shared:
    external: true
