services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:${VERSION}
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: curl -f http://localhost:9000/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - homelab_infrastructure

volumes:
  portainer_data:

networks:
  homelab_infrastructure:
    external: true
