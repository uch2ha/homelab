services:
  nginx-proxy-manager:
    container_name: nginx-proxy-manager
    image: 'docker.io/jc21/nginx-proxy-manager:${VERSION}'
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - homelab_infrastructure
      - homelab_media
      - homelab_monitoring
      - homelab_networking
      - homelab_security
      - homelab_common

networks:
  homelab_infrastructure:
    external: true
  homelab_media:
    external: true
  homelab_monitoring:
    external: true
  homelab_networking:
    external: true
  homelab_security:
    external: true
  homelab_common:
    external: true
