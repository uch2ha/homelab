services:
  papra:
    image: ghcr.io/papra-hq/papra:${VERSION}-rootless
    container_name: papra
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_BASE_URL: ${APP_BASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
    volumes:
      - ${APP_DATA}:/app/app-data
    user: 1000:1000
    networks:
      - homelab_media

networks:
  homelab_media:
    external: true
